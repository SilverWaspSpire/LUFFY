name: todo-scan

on:
  push:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan TODO lines
        run: |
          echo "===TODO_START==="
          grep -rn --include='*.py' 'TODO' . | sed 's|^\./||' | sort
          echo "===TODO_END==="
